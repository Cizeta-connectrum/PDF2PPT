<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アプリ一覧 - ダッシュボード</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card card-wide">
    <nav class="app-nav">
      <a href="{{ url_for('index') }}">PDF変換</a>
      <a href="{{ url_for('dashboard') }}" class="active">アプリ一覧</a>
    </nav>
    <h1>アプリ一覧</h1>
    <p class="lead">
      アプリの追加・削除はGoogleスプレッドシートを直接編集してください。ここには
      スプレッドシートの内容がそのまま表示されます。
    </p>

    <button type="button" id="refresh-btn">更新</button>
    <div id="apps-status" class="status" role="status" aria-live="polite"></div>

    <ul id="apps-list" class="apps-list"></ul>
    <p id="apps-empty" class="lead" hidden>登録されたアプリがありません。スプレッドシートに行を追加してください。</p>
  </main>

  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
